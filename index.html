alse, "is_checked": false, "is_reference": false, "path": "https://drive.google.com/uc?export=download&id=1S5qGXp6OkMDdDrFubkBNDG_62tXl29PY", "_label": null, "_labelPoint": [-76.52099914484245, 3.4179744042193585]}, "type": "Feature"}, {"bbox": [-76.52364399365578, 3.491686644621734, -76.51615202667483, 3.4953311411353134], "geometry": {"coordinates": [[[[-76.52362294880467, 3.4953311411353134], [-76.52364399365578, 3.4917496619726918], [-76.51615202667483, 3.491686644621734], [-76.51616254910034, 3.495299632580558], [-76.52362294880467, 3.4953311411353134]]]], "type": "MultiPolygon"}, "id": 161, "properties": {"description": "Autopista Orienta - Kïlometro 1", "id": 261, "is_bridge": false, "is_checked": false, "is_reference": false, "path": "https://drive.google.com/uc?export=download&id=1BgAlcH4JxY_Cxc6EXdHRMASg9UhpY-BA", "_label": null, "_labelPoint": [-76.51989547172789, 3.493524647276625]}, "type": "Feature"}]}}, {"name": "Google Map ", "id": "Google_Map__bbfb1dc2_d43e_43c2_9600_23a5aeab9592", "type": "tile", "url": "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", "minZoom": 0, "maxZoom": 22}];
const LEGEND = [{"name": "image", "type": "polygon", "color": "#ffb903", "fill": "#ffb903"}, {"name": "Google Map ", "type": "tile", "color": "#666666"}];
const FIT_BOUNDS = null;
const LABELS_SUFFIX = " (Labels)";
const map = L.map('map', {zoomControl:true, attributionControl:false});
if (map.attributionControl) { try { map.attributionControl.remove(); } catch(e) {} }
const layerControl = L.control.layers({}, null, {collapsed:false}).addTo(map);

(function(){
  const el=document.getElementById('legend');
  LEGEND.forEach(function(item){
    const row=document.createElement('div'); row.className='legend-item';
    const sw=document.createElement('span'); sw.style.color=item.color||'#3388ff';
    if(item.type==='point') sw.className='swatch-point';
    else if(item.type==='line') sw.className='swatch-line';
    else if(item.type==='raster' || item.type==='tile') { sw.className='swatch-poly'; sw.style.background='linear-gradient(45deg,#999,#ddd)'; sw.style.opacity='1'; }
    else { sw.className='swatch-poly'; sw.style.background=item.fill||item.color||'#3388ff'; sw.style.opacity='0.25';}
    const name=document.createElement('span'); name.textContent=item.name;
    row.appendChild(sw); row.appendChild(name); el.appendChild(row);
  });
})();

function styleFrom(st){
  if(st.type==='line') return {color:st.color,weight:st.weight||3,opacity:(st.opacity ?? 0.9)};
  if(st.type==='polygon') return {color:st.color,weight:st.weight||2,opacity:(st.opacity ?? 0.9),fillColor:st.fillColor||st.color,fillOpacity:(st.fillOpacity ?? 0.25)};
  return null;
}
function pointToLayerFrom(st, feature, latlng){
  return L.circleMarker(latlng,{radius:st.radius||7,color:st.color||'#cc3333',weight:2,opacity:(st.opacity ?? 1),fillColor:st.fillColor||st.color||'#cc3333',fillOpacity:(st.fillOpacity ?? 0.8)});
}
function mercatorToWgs84(x,y){
  const lon = (x / 20037508.34) * 180.0;
  let lat = (y / 20037508.34) * 180.0;
  lat = 180 / Math.PI * (2 * Math.atan(Math.exp(lat * Math.PI / 180.0)) - Math.PI / 2);
  return [lon, lat];
}
function normalizeCoords(coords){
  if(!Array.isArray(coords)) return coords;
  if(typeof coords[0] === 'number' && typeof coords[1] === 'number'){
    const x = coords[0], y = coords[1];
    if(Math.abs(x) > 180 || Math.abs(y) > 90){
      return mercatorToWgs84(x, y);
    }
    return coords;
  }
  return coords.map(normalizeCoords);
}
function normalizeGeoJSON(gj){
  if(!gj || !gj.features) return gj;
  gj.features.forEach(function(f){
    if(f.geometry && f.geometry.coordinates){
      f.geometry.coordinates = normalizeCoords(f.geometry.coordinates);
    }
    if(f.properties && f.properties._labelPoint){
      const p = f.properties._labelPoint;
      if(Array.isArray(p) && p.length >= 2 && (Math.abs(p[0]) > 180 || Math.abs(p[1]) > 90)){
        f.properties._labelPoint = mercatorToWgs84(p[0], p[1]);
      }
    }
  });
  return gj;
}
function manualBoundsFromGeoJSON(gj){
  let minLat=90,minLng=180,maxLat=-90,maxLng=-180;
  function visit(c){
    if(!c) return;
    if(typeof c[0]==='number' && typeof c[1]==='number'){
      const lng=c[0], lat=c[1];
      if(lat<minLat) minLat=lat; if(lng<minLng) minLng=lng; if(lat>maxLat) maxLat=lat; if(lng>maxLng) maxLng=lng;
    } else if(Array.isArray(c)) c.forEach(visit);
  }
  try { (gj.features||[]).forEach(function(f){ visit(f.geometry && f.geometry.coordinates); }); } catch(e) {}
  if(minLat<=maxLat && minLng<=maxLng) return L.latLngBounds([minLat,minLng],[maxLat,maxLng]);
  return null;
}
function escHtml(s){
  const d=document.createElement('div');
  d.appendChild(document.createTextNode(String(s)));
  return d.innerHTML;
}
function buildPopup(feature, layer, popupFields, fieldAliases, fieldOrder){
  const props=feature.properties||{};
  const aliases=fieldAliases||{};
  let keys;
  if(popupFields && popupFields.length){
    // User selected specific fields — they are already stored in layer schema order
    keys = popupFields;
  } else if(fieldOrder && fieldOrder.length){
    // All fields — use the layer's schema order, skip internal underscore keys
    keys = fieldOrder.filter(function(k){ return k in props; });
  } else {
    keys = Object.keys(props).filter(function(k){ return k.charAt(0)!=='_'; });
  }
  let rows='';
  keys.forEach(function(k){
    if(k.charAt(0)==='_') return;
    const v=props[k];
    if(v!==null&&v!==undefined){
      const label=aliases[k]||k;
      rows+='<tr><td style="padding:2px 10px 2px 0;font-weight:bold;white-space:nowrap">'+escHtml(label)+'</td>'
           +'<td style="padding:2px 0">'+escHtml(v)+'</td></tr>';
    }
  });
  if(rows){
    layer.bindPopup('<table style="border-collapse:collapse;min-width:100px">'+rows+'</table>',{maxWidth:400});
  }
}

const footnotes = [];
function renderFootnotes(){
  const el=document.getElementById('footnotes'); el.innerHTML='';
  if(!footnotes.length){ el.textContent='—'; return; }
  const byLayer={};
  footnotes.forEach(function(fn){ if(!byLayer[fn.layer]) byLayer[fn.layer]=[]; byLayer[fn.layer].push(fn); });
  Object.keys(byLayer).forEach(function(layerName){
    const h=document.createElement('div'); h.style.marginTop='6px'; h.innerHTML='<b>'+layerName+'</b>'; el.appendChild(h);
    byLayer[layerName].forEach(function(fn){ const d=document.createElement('div'); d.textContent=fn.n+': '+fn.text; el.appendChild(d); });
  });
}
function createLabelMarker(latlng, html, className, anchorY){
  const icon=L.divIcon({className:'', html:'<span class="'+className+'">'+html+'</span>', iconAnchor:[0, anchorY||0]});
  return L.marker(latlng,{icon:icon, interactive:false});
}
function buildLabelsForLayer(layerDef, group){
  // One label marker per feature. Labelgun handles collisions between
  // different features: if two labels overlap, the loser is replaced by
  // a numbered marker and its text is moved to the footnotes panel.
  const records=[]; let counter=1;
  (layerDef.geojson.features||[]).forEach(function(f){
    if(!f.properties || !f.properties._label || !f.properties._labelPoint) return;
    const latlng=[f.properties._labelPoint[1], f.properties._labelPoint[0]];
    const text=String(f.properties._label);
    const lbl=createLabelMarker(latlng, text, 'label', 20);
    lbl.addTo(group);
    const num=createLabelMarker(latlng, counter, 'label-num', 8);
    num.addTo(group);
    if(num.getElement()) num.getElement().style.display='none';
    records.push({n:counter, text:text, layer:layerDef.name, lbl:lbl, num:num, id:layerDef.id+'_'+counter});
    counter += 1;
  });
  function compute(){
    for(let i=footnotes.length-1;i>=0;i--) if(footnotes[i].layer===layerDef.name) footnotes.splice(i,1);
    const engine=new Labelgun(), ids=[];
    records.forEach(function(rec){
      if(rec.lbl.getElement()) rec.lbl.getElement().style.display='';
      if(rec.num.getElement()) rec.num.getElement().style.display='none';
      const el=rec.lbl.getElement(); if(!el) return;
      const r=el.getBoundingClientRect();
      engine.addLabel(el,{minX:r.left,minY:r.top,maxX:r.right,maxY:r.bottom},rec.id);
      ids.push(rec.id);
    });
    engine.render(ids);
    records.forEach(function(rec){
      if(rec.lbl.getElement() && rec.lbl.getElement().style.display==='none'){
        if(rec.num.getElement()) rec.num.getElement().style.display='';
        footnotes.push({layer:rec.layer, n:rec.n, text:rec.text});
      }
    });
    renderFootnotes();
  }
  map.whenReady(function(){ compute(); map.on('zoomend moveend', compute); });
}

// Pass 1: create layers (LAYERS is in QGIS top-to-bottom order).
// Label groups are added to the map immediately so markers get DOM elements,
// but are NOT registered in layerControl — avoiding name duplication.
// Visibility of labels is synced to the main layer via overlayadd/overlayremove events.
const _entries = [];
LAYERS.forEach(function(layerDef){
  let mainLayer = null, labelsLayer = null, vBounds = null;

  if(layerDef.type === 'tile'){
    try{
      mainLayer = L.tileLayer(layerDef.url, {minZoom: layerDef.minZoom||0, maxZoom: layerDef.maxZoom||22});
    }catch(e){}
  } else if(layerDef.type === 'raster'){
    if(layerDef.bounds && layerDef.image){
      mainLayer = L.imageOverlay('data:image/png;base64,'+layerDef.image, layerDef.bounds, {opacity:1});
      try{ vBounds = L.latLngBounds(layerDef.bounds); }catch(e){}
    }
  } else {
    const st = layerDef.style || {};
    layerDef.geojson = normalizeGeoJSON(layerDef.geojson);
    const onEach = layerDef.popup
      ? function(feature, layer){ buildPopup(feature, layer, layerDef.popup_fields||[], layerDef.field_aliases||{}, layerDef.field_order||[]); }
      : null;
    mainLayer = L.geoJSON(layerDef.geojson, {
      style: function(){ return styleFrom(st); },
      pointToLayer: function(feature, latlng){ return pointToLayerFrom(st, feature, latlng); },
      onEachFeature: onEach
    });
    try{
      const gb = mainLayer.getBounds();
      if(gb && gb.isValid && gb.isValid()) vBounds = gb;
      else{ const mb = manualBoundsFromGeoJSON(layerDef.geojson); if(mb) vBounds = mb; }
    }catch(e){
      const mb2 = manualBoundsFromGeoJSON(layerDef.geojson); if(mb2) vBounds = mb2;
    }
    if(layerDef.labels){
      labelsLayer = L.layerGroup();
      labelsLayer.addTo(map);  // Add now so markers get DOM elements immediately
      buildLabelsForLayer(layerDef, labelsLayer);
    }
  }

  if(mainLayer) _entries.push({def: layerDef, layer: mainLayer, labelsLayer: labelsLayer, vBounds: vBounds});
});

// Pass 2: add main layers to map in reverse order so the topmost QGIS layer renders on top.
let allBounds = null;
for(let i = _entries.length - 1; i >= 0; i--){
  const e = _entries[i];
  e.layer.addTo(map);
  if(e.vBounds) allBounds = allBounds ? allBounds.extend(e.vBounds) : e.vBounds;
  // Sync labels visibility when user toggles the main layer checkbox
  if(e.labelsLayer){
    (function(ml, ll){
      map.on('overlayadd',    function(ev){ if(ev.layer === ml && !map.hasLayer(ll)) ll.addTo(map); });
      map.on('overlayremove', function(ev){ if(ev.layer === ml) map.removeLayer(ll); });
    })(e.layer, e.labelsLayer);
  }
}
// Pass 3: add to the control in QGIS order (top layer first).
// The labels group gets its own entry with a suffix so it can be toggled independently.
_entries.forEach(function(e){
  layerControl.addOverlay(e.layer, e.def.name);
  if(e.labelsLayer) layerControl.addOverlay(e.labelsLayer, e.def.name + LABELS_SUFFIX);
});

if(allBounds) map.fitBounds(allBounds, {padding:[20,20]});
else if(FIT_BOUNDS) map.fitBounds(FIT_BOUNDS, {padding:[20,20]});
else map.setView([0,0], 2);
L.control.scale().addTo(map);
