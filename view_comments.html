<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ver Comentarios</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;margin:0;padding:20px}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:1100px;margin:20px auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #e5e7eb;padding:10px;text-align:left;cursor:pointer}
th{background:#f8fafc;font-weight:600;cursor:default}
tr:hover td{background:#f1f5f9}
.badge{padding:2px 8px;border-radius:9999px;font-size:12px}
.badge-si{background:#b7e1cd}
.badge-no{background:#fff2cc}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;padding:20px}
#modal-overlay.active{display:flex}
#modal{background:white;border-radius:12px;max-width:500px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#modal h3{margin:0 0 12px 0;font-size:16px}
#modal p{margin:6px 0;font-size:14px;word-break:break-word}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
#btn-cerrar{background:#e5e7eb;color:#111}
#btn-editar{background:#1a73e8;color:white}
</style>
</head>
<body>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<a href="./index.html" style="background:#2c3e50;color:white;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600">← Volver al mapa</a>
<button id="btn-recargar" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:white;cursor:pointer">Recargar</button>
<button id="btn-descargar" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:white;cursor:pointer" onclick="descargarExcel()">Descargar</button>
</div>
<div id="estado" style="font-size:13px;color:#666;margin-bottom:10px">Cargando...</div>
<table id="tabla">
<thead>
<tr><th>Fecha</th><th>Revisado por</th><th>Kilómetro / Avenida</th><th>Novedades</th><th>Aprobado</th><th>Corregido</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="modal-overlay">
<div id="modal">
<h3 id="modal-fecha"></h3>
<p><strong>Revisado por:</strong> <span id="modal-revisado"></span></p>
<p><strong>Kilómetro / Avenida:</strong> <span id="modal-km"></span></p>
<p><strong>Novedades:</strong> <span id="modal-nov"></span></p>
<p><strong>Aprobado:</strong> <span id="modal-aprob"></span></p>
<p><strong>Corregido:</strong> <span id="modal-corr"></span></p>
<p><strong>Fila:</strong> <span id="modal-row"></span></p>
<div class="modal-actions">
<button id="btn-cerrar">Cerrar</button>
<button id="btn-editar">Editar</button>
</div>
</div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJMUIEBDBnKI7mzBCcTAwobnw61pnA8LynXY7ZWBNfqcqn6C80PO1V1DBSx9u07oon/exec";
const tbody = document.querySelector('#tabla tbody');
const estado = document.getElementById('estado');
const overlay = document.getElementById('modal-overlay');
let seleccionado = null;

function formatearFecha(f){
  try{
    const d = new Date(f);
    if(isNaN(d)) return f;
    return d.toLocaleString("es-CO",{timeZone:"America/Bogota"});
  }catch{ return f; }
}

async function cargar(){
  estado.textContent = "Cargando...";
  tbody.innerHTML = "";
  try{
    const res = await fetch(APPS_SCRIPT_URL + "?action=list");
    const json = await res.json();
    if(!json.ok) throw new Error(json.error||"Error");
    const data = json.data||[];
    if(data.length===0){ estado.textContent = "Sin datos"; return; }
    data.forEach(item=>{
      const tr = document.createElement('tr');
      tr.dataset.row = item.row;
      tr.dataset.revisado = item.revisado_por||"";
      tr.dataset.km = item.kilometro_avenida||"";
      tr.dataset.nov = item.novedades||"";
      tr.dataset.aprob = item.aprobado||"";
      tr.dataset.corr = item.corregido||"";
      tr.dataset.fecha = item.fecha||"";
      tr.innerHTML = `<td>${formatearFecha(item.fecha)}</td><td>${item.revisado_por||""}</td><td>${item.kilometro_avenida||""}</td><td>${(item.novedades||"").substring(0,80)}</td><td><span class="badge ${String(item.aprobado).toUpperCase()==="SI"?"badge-si":"badge-no"}">${item.aprobado||""}</span></td><td>${item.corregido||""}</td>`;
      tr.addEventListener('click',()=>abrirPopup(tr.dataset));
      tbody.appendChild(tr);
    });
    estado.textContent = `${data.length} registros`;
  }catch(err){
    estado.textContent = "Error: "+err.message;
  }
}

function abrirPopup(d){
  seleccionado = d;
  document.getElementById('modal-fecha').textContent = formatearFecha(d.fecha);
  document.getElementById('modal-revisado').textContent = d.revisado;
  document.getElementById('modal-km').textContent = d.km;
  document.getElementById('modal-nov').textContent = d.nov;
  document.getElementById('modal-aprob').textContent = d.aprob;
  document.getElementById('modal-corr').textContent = d.corr;
  document.getElementById('modal-row').textContent = d.row;
  overlay.classList.add('active');
}

function cerrarPopup(){
  overlay.classList.remove('active');
  seleccionado = null;
}

document.getElementById('btn-cerrar').addEventListener('click', cerrarPopup);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cerrarPopup(); });
document.getElementById('btn-editar').addEventListener('click', ()=>{
  if(!seleccionado) return;
  const params = new URLSearchParams({
    row: seleccionado.row,
    revisado_por: seleccionado.revisado,
    kilometro_avenida: seleccionado.km,
    novedades: seleccionado.nov
  });
  window.location.href = "./edits.html?"+params.toString();
});
document.getElementById('btn-recargar').addEventListener('click', cargar);
cargar();
function descargarExcel() {
  const SHEET_ID = "10gjs7MlqCHfBYK2SbIGSHdVtN6KzyXlJP6Vjje3TTaQ";
  // Esto fuerza la descarga directa a la computadora
  window.location.href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`;
}
</script>
</body>
</html>
